version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/srv/backend
      - ./database:/srv/database
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GEMINI_API_KEY=

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/srv/frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  database_data: {}
